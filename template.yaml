              Resource: !GetAtt PooledUserPool.Arn
    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [user-management.ts],
          },
      }

  DisableUsersByTenantFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/TenantManagmentService
      Handler: user-management.disableUsersByTenant
      Events:
        {
          ApiPut:
            { Type: Api, Properties: { RestApiId: !Ref TenantApi, Path: /users/disable, Method: put } },
