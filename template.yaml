    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [handlers.ts],
          },
      }

  CreateProduct:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/ProductService
      Handler: handlers.createProductHandler
      Events:
        { ApiPost: { Type: Api, Properties: { RestApiId: !Ref TenantApi, Path: /product, Method: post } } }
      Environment: { Variables: { PRODUCT_TABLE_NAME: !Ref ProductTable } }
