          ApiGet:
            { Type: Api, Properties: { RestApiId: !Ref TenantApi, Path: "/product/{id}", Method: get } },
        }
      Environment: { Variables: { PRODUCT_TABLE_NAME: !Ref ProductTable } }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ProductTable }
    Metadata:
