    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [tenant-management.ts],
          },
      }

  LoadTenantConfigFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/TenantManagmentService
      Handler: tenant-management.loadTenantConfig
      Events:
        {
          ApiGet:
            {
              Type: Api,
              Properties: { RestApiId: !Ref TenantApi, Path: "/tenant/init/{tenantname}", Method: get },
            },
        }
      Environment:
        {
          Variables:
            {
              TABLE_TENANT_DETAILS: !Ref TenantDetailsTable,
              TABLE_SETTINGS: !Ref SettingsTable,
            },
        }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TenantDetailsTable }
    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [tenant-management.ts],
          },
      }

  # tenant-registration.ts
  RegisterTenantFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/TenantManagmentService
      Handler: tenant-registration.registerTenant
      Events:
        {
          ApiPost:
            {
              Type: Api,
              Properties:
                { RestApiId: !Ref TenantApi,
                  Path: /registration,
                  Method: post,
                  Auth: { Authorizer: NONE, ApiKeyRequired: false },
                },
            },
        }
      Timeout: 30
      Environment:
        Variables:
          TENANT_USER_POOL_ID: !Ref PooledUserPool
          TENANT_APP_CLIENT_ID: !Ref PooledUserPoolClient
          TABLE_TENANT_DETAILS: !Ref TenantDetailsTable
          TABLE_SETTINGS: !Ref SettingsTable
          TABLE_TENANT_USER_MAPPING: !Ref TenantUserMappingTable
          TENANT_STACK_MAPPING_TABLE_NAME: !Ref TenantStackMappingTable
          PIPELINE_NAME: serverless-saas-pipeline
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TenantDetailsTable }
        - DynamoDBReadPolicy: { TableName: !Ref SettingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref TenantUserMappingTable }
        - DynamoDBCrudPolicy: { TableName: !Ref TenantStackMappingTable }
        - Version: "2012-10-17"
          Statement:
            - Sid: ManageTenantUsers
              Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt PooledUserPool.Arn
            - Sid: StartTenantPipeline
              Effect: Allow
              Action: codepipeline:StartPipelineExecution
              Resource: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:serverless-saas-pipeline
            - Sid: ReadApiKeysFromSsm
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:GetParametersByPath
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/api-keys/*
            - Sid: ManageApiGatewayForPremiumTenants
              Effect: Allow
              Action:
                - apigateway:POST
                - apigateway:GET
                - apigateway:PUT
                - apigateway:PATCH
                - apigateway:DELETE
              Resource:
                - !Sub arn:aws:apigateway:${AWS::Region}::/apikeys
                - !Sub arn:aws:apigateway:${AWS::Region}::/apikeys/*
                - !Sub arn:aws:apigateway:${AWS::Region}::/usageplans
                - !Sub arn:aws:apigateway:${AWS::Region}::/usageplans/*

    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [tenant-registration.ts],
          },
      }

  # user-management.ts
  CreateTenantAdminUserFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/TenantManagmentService
      Handler: user-management.createTenantAdminUser
      Events:
        {
          ApiPost:
            {
              Type: Api,
              Properties:
                { RestApiId: !Ref TenantApi,
                  Path: /user/tenant-admin,
                  Method: post,
                },
            },
        }
      Environment:
        Variables:
          TENANT_USER_POOL_ID: !Ref PooledUserPool
          TENANT_APP_CLIENT_ID: !Ref PooledUserPoolClient
          TABLE_TENANT_USER_MAPPING: !Ref TenantUserMappingTable
          TABLE_TENANT_DETAILS: !Ref TenantDetailsTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TenantUserMappingTable }
        - Statement:
            - Effect: Allow
