AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless multi-tenant SaaS: shared (pooled) infrastructure, tenant
  management, authorizer and usage plans

Globals:
  Function:
    Timeout: 10
    Runtime: nodejs22.x
    Tracing: Active
    LoggingConfig: { LogFormat: JSON }

Parameters:
  PlatinumTierApiKey:
    Type: String
    NoEcho: true
  PremiumTierApiKey:
    Type: String
    NoEcho: true
  StandardTierApiKey:
    Type: String
    NoEcho: true
  BasicTierApiKey:
    Type: String
    NoEcho: true
  SystemAdminApiKey:
    Type: String
    NoEcho: true

Resources:
  ########################
  # API Gateway
  ########################
  TenantApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      TracingEnabled: true
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: TenantLambdaAuthorizer
        ApiKeyRequired: true
        Authorizers:
          TenantLambdaAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            FunctionPayloadType: TOKEN
            Identity:
              Header: Authorization
              ValidationExpression: "^Bearer .+$"
              ReauthorizeEvery: 300
      # Usage plans are picked by the key the authorizer returns
      # (usageIdentifierKey), so clients can't choose a plan by sending
      # another tier's x-api-key header.
      ApiKeySourceType: AUTHORIZER
      MethodSettings:
        # Public self-registration creates users and, for PLATINUM, whole
        # stacks; throttle it hard.
        - ResourcePath: "/~1registration"
          HttpMethod: POST
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 5

  ########################
  # DynamoDB (orders/products)
  ########################
  OrderTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: OrderTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: shardId, AttributeType: S }
        - { AttributeName: orderId, AttributeType: S }
      KeySchema:
        - { AttributeName: shardId, KeyType: HASH }
        - { AttributeName: orderId, KeyType: RANGE }

  ProductTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ProductTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: shardId, AttributeType: S }
        - { AttributeName: productId, AttributeType: S }
      KeySchema:
        - { AttributeName: shardId, KeyType: HASH }
        - { AttributeName: productId, KeyType: RANGE }

  ########################
  # DynamoDB (tenant mgmt)
  ########################
  SettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ServerlessSaaS-Settings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: settingName, AttributeType: S }
      KeySchema:
        - { AttributeName: settingName, KeyType: HASH }

  TenantDetailsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ServerlessSaaS-TenantDetails
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: tenantId, AttributeType: S }
        - { AttributeName: tenantName, AttributeType: S }
      KeySchema:
        - { AttributeName: tenantId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: ServerlessSaas-TenantConfig
          KeySchema:
            - { AttributeName: tenantName, KeyType: HASH }
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [userPoolId, appClientId, apiGatewayUrl]

  TenantUserMappingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ServerlessSaaS-TenantUserMapping
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: tenantId, AttributeType: S }
        - { AttributeName: userName, AttributeType: S }
      KeySchema:
        - { AttributeName: tenantId, KeyType: HASH }
        - { AttributeName: userName, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: UserName
          KeySchema:
            - { AttributeName: userName, KeyType: HASH }
            - { AttributeName: tenantId, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  TenantStackMappingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TenantStackMapping
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenantId
          AttributeType: S
      KeySchema:
        - AttributeName: tenantId
          KeyType: HASH

  ########################
  # Cognito (pooled tenant)
  ########################
  PooledUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: PooledTenant-ServerlessSaaSUserPool
      AutoVerifiedAttributes: [email]
      Schema:
        - {
            Name: email,
            AttributeDataType: String,
            Required: true,
            Mutable: true,
          }
        # Immutable, and not in the client's WriteAttributes: only the
        # backend sets them, at user creation
        - { Name: tenantId, AttributeDataType: String, Mutable: false }
        - { Name: userRole, AttributeDataType: String, Mutable: false }

  PooledUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ServerlessSaaSClient
      GenerateSecret: false
      UserPoolId: !Ref PooledUserPool
      AllowedOAuthFlowsUserPoolClient: false
      # Without WriteAttributes, users could call UpdateUserAttributes and
      # rewrite custom:tenantId / custom:userRole in their own tokens
      ReadAttributes: [email, email_verified, custom:tenantId, custom:userRole]
      WriteAttributes: [email]
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH # used by the load-test scripts
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  ########################
  # Orders — Lambdas & API
  ########################
  GetOrder:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/OrderService
      Handler: handlers.getOrderHandler
      Events:
        {
          ApiGet:
            { Type: Api, Properties: { RestApiId: !Ref TenantApi, Path: "/order/{id}", Method: get } },
        }
      Environment: { Variables: { ORDER_TABLE_NAME: !Ref OrderTable } }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref OrderTable }
    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [handlers.ts],
          },
      }

  DeleteOrder:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/OrderService
      Handler: handlers.deleteOrderHandler
      Events:
        {
          ApiDel:
            { Type: Api, Properties: { RestApiId: !Ref TenantApi, Path: "/order/{id}", Method: delete } },
        }
      Environment: { Variables: { ORDER_TABLE_NAME: !Ref OrderTable } }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref OrderTable }
    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [handlers.ts],
          },
      }

  UpdateOrder:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/OrderService
      Handler: handlers.updateOrderHandler
      Events:
        {
          ApiPut:
            { Type: Api, Properties: { RestApiId: !Ref TenantApi, Path: "/order/{id}", Method: put } },
        }
      Environment: { Variables: { ORDER_TABLE_NAME: !Ref OrderTable } }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref OrderTable }
    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [handlers.ts],
          },
      }

  CreateOrder:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/OrderService
      Handler: handlers.createOrderHandler
      Events:
        { ApiPost: { Type: Api, Properties: { RestApiId: !Ref TenantApi, Path: /order, Method: post } } }
      Environment: { Variables: { ORDER_TABLE_NAME: !Ref OrderTable } }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref OrderTable }
    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [handlers.ts],
          },
      }

  GetAllOrders:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/OrderService
      Handler: handlers.getAllOrdersHandler
      Events:
        { ApiGetAll: { Type: Api, Properties: { RestApiId: !Ref TenantApi, Path: /orders, Method: get } } }
      Environment: { Variables: { ORDER_TABLE_NAME: !Ref OrderTable } }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref OrderTable }
    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [handlers.ts],
          },
      }

  ########################
