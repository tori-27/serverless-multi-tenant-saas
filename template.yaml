      Environment:
        Variables:
          TENANT_USER_POOL_ID: !Ref PooledUserPool
          TABLE_TENANT_USER_MAPPING: !Ref TenantUserMappingTable
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TenantUserMappingTable }
        - Statement:
            - Effect: Allow
              Action: [cognito-idp:AdminDisableUser]
              Resource: !GetAtt PooledUserPool.Arn
    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [user-management.ts],
          },
      }

  ProvisionTenantFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/TenantManagmentService
      Handler: tenant-provisioning.provisionTenant
      Events:
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref TenantApi
            Path: /provisioning
            Method: post
      Environment:
        Variables:
          TENANT_STACK_MAPPING_TABLE_NAME: !Ref TenantStackMappingTable
          PIPELINE_NAME: "serverless-saas-pipeline"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TenantStackMappingTable
        - Statement:
            - Effect: Allow
              Action:
                - codepipeline:StartPipelineExecution
              Resource: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:serverless-saas-pipeline
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints: [tenant-provisioning.ts]

  DeProvisionTenantFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/TenantManagmentService
      Handler: tenant-provisioning.deprovisionTenant
      Events:
        ApiPut:
          Type: Api
          Properties:
            RestApiId: !Ref TenantApi
            Path: /provisioning/{tenantid}
            Method: put
      Environment:
        Variables:
          TENANT_STACK_MAPPING_TABLE_NAME: !Ref TenantStackMappingTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TenantStackMappingTable
        # CloudFormation deletes the tenant stack with this function's
        # permissions, so it also needs to delete the stack's resources.
        # Everything is limited to tenant-named resources (t-*).
        - Statement:
            - Effect: Allow
              Action:
                - cloudformation:DeleteStack
                - cloudformation:DescribeStacks
              Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stack-t-*/*
            - Effect: Allow
              Action:
                - dynamodb:DeleteTable
                - dynamodb:DescribeTable
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Product-t-*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Order-t-*
            - Effect: Allow
              Action:
                - lambda:DeleteFunction
                - lambda:GetFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:t-*
            - Effect: Allow
              Action:
                - iam:DeleteRole
                - iam:DeleteRolePolicy
                - iam:DetachRolePolicy
                - iam:GetRole
              Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/t-*
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints: [tenant-provisioning.ts]

  ########################
  # (Optional) App Insights
  ########################
  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Sub ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery: { Type: CLOUDFORMATION_STACK_1_0 }

  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName: !Ref ApplicationResourceGroup
      AutoConfigurationEnabled: true

  ########################
  # Lambda Authorizer
  ########################
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TenantAuthorizer
      CodeUri: src/AuthService
      Handler: authorizer.handler
      Timeout: 10
      Environment:
        Variables:
          TABLE_TENANT_DETAILS: !Ref TenantDetailsTable
          POOLED_USER_POOL_ID: !Ref PooledUserPool
          POOLED_APP_CLIENT_ID: !Ref PooledUserPoolClient
          OPERATION_USERS_API_KEY: !Ref SystemAdminApiKey
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TenantDetailsTable
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !GetAtt AuthorizerAccessRole.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints: [authorizer.ts]
        External: ["@aws-sdk/*"]

  ########################
  # IAM Role for Authorizer STS
  ########################
  AuthorizerAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: authorizer-access-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Product-*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Order-*"
                  - !GetAtt ProductTable.Arn
                  - !GetAtt OrderTable.Arn

  ########################
  # API Keys
  ########################
  ApiKeyPlatinumTier:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: ServerlessSaaS-Platinum-Key-v2
      Description: API key for Platinum tier tenants
      Enabled: true
      Value: !Ref PlatinumTierApiKey

  ApiKeyPremiumTier:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: ServerlessSaaS-Premium-Key-v2
      Description: API key for Premium tier tenants
      Enabled: true
      Value: !Ref PremiumTierApiKey

  ApiKeyStandardTier:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: ServerlessSaaS-Standard-Key-v2
      Description: API key for Standard tier tenants
      Enabled: true
      Value: !Ref StandardTierApiKey

  ApiKeyBasicTier:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: ServerlessSaaS-Basic-Key-v2
      Description: API key for Basic tier tenants
      Enabled: true
      Value: !Ref BasicTierApiKey

  ApiKeySystemAdmin:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: ServerlessSaaS-Admin-Key-v2
      Description: API key for System Administrators
      Enabled: true
      Value: !Ref SystemAdminApiKey

  # Tier keys read by tenant registration (/api-keys/<tier>)
  ApiKeyParamPlatinum:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /api-keys/platinum
      Type: String
      Value: !Ref PlatinumTierApiKey
  ApiKeyParamPremium:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /api-keys/premium
      Type: String
      Value: !Ref PremiumTierApiKey
  ApiKeyParamStandard:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /api-keys/standard
      Type: String
      Value: !Ref StandardTierApiKey
  ApiKeyParamBasic:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /api-keys/basic
      Type: String
      Value: !Ref BasicTierApiKey

  ########################
  # Usage Plans
  ########################
  UsagePlanPlatinumTier:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: TenantApiProdStage
    Properties:
      UsagePlanName: Plan_Platinum_Tier
      Description: Usage plan for Platinum tier tenants - highest limits
      ApiStages:
        - ApiId: !Ref TenantApi
          Stage: Prod
      Quota:
        Limit: 10000
        Period: DAY
      Throttle:
        BurstLimit: 300
        RateLimit: 300

  UsagePlanPremiumTier:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: TenantApiProdStage
    Properties:
      UsagePlanName: Plan_Premium_Tier
      Description: Usage plan for Premium tier tenants
      ApiStages:
        - ApiId: !Ref TenantApi
          Stage: Prod
      Quota:
        Limit: 5000
        Period: DAY
      Throttle:
        BurstLimit: 200
        RateLimit: 100

  UsagePlanStandardTier:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: TenantApiProdStage
    Properties:
      UsagePlanName: Plan_Standard_Tier
      Description: Usage plan for Standard tier tenants
      ApiStages:
        - ApiId: !Ref TenantApi
          Stage: Prod
      Quota:
        Limit: 3000
        Period: DAY
      Throttle:
        BurstLimit: 100
        RateLimit: 75

  UsagePlanBasicTier:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: TenantApiProdStage
    Properties:
      UsagePlanName: Plan_Basic_Tier
      Description: Usage plan for Basic tier tenants - lowest limits
      ApiStages:
        - ApiId: !Ref TenantApi
          Stage: Prod
      Quota:
        Limit: 500
        Period: DAY
      Throttle:
        BurstLimit: 50
        RateLimit: 50

  UsagePlanSystemAdmin:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: TenantApiProdStage
    Properties:
      UsagePlanName: Plan_System_Admin
      Description: Usage plan for System Administrators
      ApiStages:
        - ApiId: !Ref TenantApi
          Stage: Prod
      Quota:
        Limit: 50000
        Period: DAY
      Throttle:
        BurstLimit: 500
        RateLimit: 500

  ########################
  # Usage Plan Key Associations
  ########################
  UsagePlanKeyPlatinum:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKeyPlatinumTier
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlanPlatinumTier

  UsagePlanKeyPremium:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKeyPremiumTier
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlanPremiumTier

  UsagePlanKeyStandard:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKeyStandardTier
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlanStandardTier

  UsagePlanKeyBasic:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKeyBasicTier
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlanBasicTier

  UsagePlanKeySystemAdmin:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKeySystemAdmin
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlanSystemAdmin

Outputs:
  ApiBaseUrl:
    Value: !Sub "https://${TenantApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  SettingsTableName:
    Value: !Ref SettingsTable
  TenantDetailsTableName:
    Value: !Ref TenantDetailsTable
  TenantUserMappingTableName:
    Value: !Ref TenantUserMappingTable
  PooledUserPoolId:
    Value: !Ref PooledUserPool
  PooledUserPoolClientId:
    Value: !Ref PooledUserPoolClient
  TenantStackMappingTableName:
    Value: !Ref TenantStackMappingTable
  AuthorizerFunctionArn:
    Value: !GetAtt AuthorizerFunction.Arn
  UsagePlanBasicTierId:
    Value: !Ref UsagePlanBasicTier
  UsagePlanStandardTierId:
    Value: !Ref UsagePlanStandardTier
  UsagePlanPremiumTierId:
    Value: !Ref UsagePlanPremiumTier
  UsagePlanPlatinumTierId:
    Value: !Ref UsagePlanPlatinumTier
