            EntryPoints: [tenant-management.ts],
          },
      }

  UpdateTenantFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/TenantManagmentService
      Handler: tenant-management.updateTenant
      Events:
        {
          ApiPut:
            {
              Type: Api,
              Properties: { RestApiId: !Ref TenantApi, Path: "/tenant/{tenantid}", Method: put },
            },
        }
      Environment:
        {
          Variables:
            {
              TABLE_TENANT_DETAILS: !Ref TenantDetailsTable,
              TABLE_SETTINGS: !Ref SettingsTable,
            },
        }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TenantDetailsTable }
    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [tenant-management.ts],
          },
      }

  GetTenantFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/TenantManagmentService
      Handler: tenant-management.getTenant
      Events:
        {
          ApiGet:
            {
              Type: Api,
              Properties: { RestApiId: !Ref TenantApi, Path: "/tenant/{tenantid}", Method: get },
            },
        }
      Environment:
        {
          Variables:
            {
              TABLE_TENANT_DETAILS: !Ref TenantDetailsTable,
              TABLE_SETTINGS: !Ref SettingsTable,
            },
        }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TenantDetailsTable }
    Metadata:
      {
        BuildMethod: esbuild,
        BuildProperties:
          {
            Minify: true,
            Target: es2020,
            Sourcemap: true,
            EntryPoints: [tenant-management.ts],
          },
      }

  ActivateTenantFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/TenantManagmentService
      Handler: tenant-management.activateTenant
